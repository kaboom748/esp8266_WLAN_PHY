esphome:
  name: wemo-test
  friendly_name: WEMO-TEST

  includes:
    - <user_interface.h>

  platformio_options:
    board_build.f_cpu: 160000000L


esp8266:
  board: d1_mini


# ============================================================
# UART0 libre
# ============================================================

logger:
  baud_rate: 0
  level: NONE


# ============================================================
# USB CH340 WEMOS D1 MINI
#
# GPIO1 = TX0 -> PC
# GPIO3 = RX0 <- PC
# ============================================================

uart:
  id: usb_serial

  tx_pin: GPIO1
  rx_pin: GPIO3

  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

  rx_buffer_size: 256


  debug:
    direction: RX
    dummy_receiver: true

    after:
      timeout: 20ms

    sequence:

      - lambda: |-

          static String line = "";

          static uint16_t current_k = 64;

          static bool phy_ready = false;

          static bool tx_active = false;


          // ====================================================
          // REGISTRES
          // ====================================================

          constexpr uint32_t TONE1 =
              0x600005B8u;

          constexpr uint32_t TONE2 =
              0x600005BCu;

          constexpr uint32_t TONE3 =
              0x600005C4u;


          constexpr uint32_t K_MASK =
              0x000003FFu;

          constexpr uint32_t GATE_MASK =
              0x00040000u;


          constexpr uint32_t PBUS_CMD =
              0x60000594u;

          constexpr uint32_t PBUS_STATUS =
              0x600005A0u;


          constexpr uint32_t RX_CTRL =
              0x60009B08u;

          constexpr uint32_t RX_STOP =
              0x08000000u;


          // ====================================================
          // ROM
          //
          // rom_set_txclk_en(int)
          // ====================================================

          constexpr uint32_t ROM_SET_TXCLK_EN =
              0x4000650Cu;


          using SetTxClkFn =
              void (*)(int);


          auto set_txclk =
              reinterpret_cast<SetTxClkFn>(
                ROM_SET_TXCLK_EN
              );


          // ====================================================
          // MMIO
          // ====================================================

          auto memw =
              []() {

            __asm__ volatile(
              "memw"
              ::: "memory"
            );

          };


          auto rd32 =
              [](uint32_t addr) -> uint32_t {

            return
              *(volatile uint32_t *) addr;

          };


          auto wr32 =
              [](uint32_t addr,
                 uint32_t value) {

            *(volatile uint32_t *) addr =
                value;

          };


          // ====================================================
          // SERIAL
          // ====================================================

          auto send =
              [&](const char *s) {

            id(usb_serial).write_str(s);

            id(usb_serial).write_str(
              "\r\n"
            );

          };


          // ====================================================
          // TRACE
          // ====================================================

          auto trace =
              [&](const char *tag) {

            uint32_t slot =
                rd32(TONE1);

            uint32_t pcmd =
                rd32(PBUS_CMD);

            uint32_t pst =
                rd32(PBUS_STATUS);

            uint32_t rx =
                rd32(RX_CTRL);


            char b[190];


            snprintf(
              b,
              sizeof(b),

              "%s SLOT=%08X G=%u DBG=%u RXSTOP=%u BUSY=%u",

              tag,

              (unsigned int)slot,

              (slot & GATE_MASK)
                ? 1
                : 0,

              (pcmd & 1u)
                ? 1
                : 0,

              (rx & RX_STOP)
                ? 1
                : 0,

              (pst & 0x80000000u)
                ? 1
                : 0
            );


            send(b);

          };


          // ====================================================
          // PHY INIT
          //
          // AUCUN ESP8266WiFi.h
          //
          // On utilise directement le SDK Espressif.
          // ====================================================

          auto phy_start =
              [&]() {

            if (phy_ready) {

              send(
                "PHY ALREADY READY"
              );

              return;

            }


            send(
              "PHY: START"
            );


            /*
             * Empêche la reconnexion automatique à
             * un ancien réseau enregistré.
             */

            bool auto_ok =
                wifi_station_set_auto_connect(
                  0
                );


            {
              char b[80];

              snprintf(
                b,
                sizeof(b),

                "PHY: AUTO_CONNECT_OFF=%u",

                auto_ok
                  ? 1
                  : 0
              );

              send(b);
            }


            /*
             * Passage NULL -> STATION_MODE.
             *
             * C'est l'étape que nous testons pour provoquer
             * l'initialisation RF/PHY du SDK.
             *
             * Pas de SSID.
             * Pas de mot de passe.
             */

            bool mode_ok =
                wifi_set_opmode_current(
                  STATION_MODE
                );


            {
              char b[80];

              snprintf(
                b,
                sizeof(b),

                "PHY: STATION_MODE=%u",

                mode_ok
                  ? 1
                  : 0
              );

              send(b);
            }


            /*
             * Laisse le SDK effectuer son initialisation PHY.
             */

            delay(
              500
            );


            /*
             * Assure qu'aucune association ne reste active.
             *
             * Contrairement à WIFI_OFF,
             * ceci ne doit pas volontairement couper
             * tout le PHY.
             */

            bool disc_ok =
                wifi_station_disconnect();


            {
              char b[80];

              snprintf(
                b,
                sizeof(b),

                "PHY: DISCONNECT=%u",

                disc_ok
                  ? 1
                  : 0
              );

              send(b);
            }


            /*
             * Désactive modem/light sleep.
             */

            bool sleep_ok =
                wifi_set_sleep_type(
                  NONE_SLEEP_T
                );


            {
              char b[80];

              snprintf(
                b,
                sizeof(b),

                "PHY: NONE_SLEEP=%u",

                sleep_ok
                  ? 1
                  : 0
              );

              send(b);
            }


            /*
             * Canal 6:
             *
             * centre Wi-Fi = 2437 MHz.
             */

            bool channel_ok =
                wifi_set_channel(
                  6
                );


            {
              char b[80];

              snprintf(
                b,
                sizeof(b),

                "PHY: CHANNEL6=%u",

                channel_ok
                  ? 1
                  : 0
              );

              send(b);
            }


            delay(
              100
            );


            phy_ready =
                true;


            send(
              "PHY: READY"
            );


            trace(
              "PHY AFTER INIT"
            );

          };


          // ====================================================
          // PBUS WRITE
          // ====================================================

          auto pbus_write =
              [&](uint8_t selector,
                  uint8_t bank,
                  uint16_t value) -> bool {

            uint32_t cmd =
                rd32(
                  PBUS_CMD
                );


            cmd &=
                0xFFFF0001u;


            cmd |=
                (
                  (uint32_t)(
                    bank
                    &
                    3u
                  )
                  << 14
                );


            cmd |=
                (
                  (uint32_t)(
                    value
                    &
                    0x1FFu
                  )
                  << 5
                );


            cmd |=
                (
                  (uint32_t)(
                    selector
                    &
                    7u
                  )
                  << 2
                );


            /*
             * START
             */

            cmd |=
                2u;


            memw();


            wr32(
              PBUS_CMD,
              cmd
            );


            memw();


            uint32_t t0 =
                micros();


            while (
              rd32(PBUS_STATUS)
              &
              0x80000000u
            ) {


              if (
                (uint32_t)(
                  micros()
                  -
                  t0
                )
                >
                2000u
              ) {


                uint32_t r =
                    rd32(
                      PBUS_CMD
                    );


                r &=
                    ~2u;


                wr32(
                  PBUS_CMD,
                  r
                );


                memw();


                return false;

              }

            }


            /*
             * START OFF
             */

            uint32_t r =
                rd32(
                  PBUS_CMD
                );


            r &=
                ~2u;


            memw();


            wr32(
              PBUS_CMD,
              r
            );


            memw();


            return true;

          };


          // ====================================================
          // MANUAL PBUS
          // ====================================================

          auto enter_manual =
              [&]() {

            uint32_t r;


            /*
             * stop_dig_rx-like
             */

            r =
                rd32(
                  RX_CTRL
                );


            r |=
                RX_STOP;


            memw();


            wr32(
              RX_CTRL,
              r
            );


            memw();


            /*
             * PBUS debug/manual
             */

            r =
                rd32(
                  PBUS_CMD
                );


            r |=
                1u;


            memw();


            wr32(
              PBUS_CMD,
              r
            );


            memw();

          };


          auto leave_manual =
              [&]() {

            uint32_t r;


            r =
                rd32(
                  PBUS_CMD
                );


            r &=
                ~1u;


            memw();


            wr32(
              PBUS_CMD,
              r
            );


            memw();


            r =
                rd32(
                  RX_CTRL
                );


            r &=
                ~RX_STOP;


            memw();


            wr32(
              RX_CTRL,
              r
            );


            memw();

          };


          // ====================================================
          // TX RF PATH
          // ====================================================

          auto tx_path_on =
              [&]() -> bool {


            send(
              "PBUS 2/1 = 1"
            );


            if (
              !pbus_write(
                2,
                1,
                1
              )
            ) {

              return false;

            }


            send(
              "PBUS 7/1 = 95"
            );


            if (
              !pbus_write(
                7,
                1,
                95
              )
            ) {

              return false;

            }


            /*
             * PBUS selector 0:
             *
             * valeur exacte encore ouverte.
             * Ne pas l'inventer.
             */

            send(
              "PBUS 0/1 preserved"
            );


            send(
              "PBUS 1/1 = 127"
            );


            if (
              !pbus_write(
                1,
                1,
                127
              )
            ) {

              return false;

            }


            send(
              "PBUS 6/1 = 127"
            );


            if (
              !pbus_write(
                6,
                1,
                127
              )
            ) {

              return false;

            }


            return true;

          };


          auto tx_path_off =
              [&]() {

            pbus_write(
              6,
              1,
              0
            );


            pbus_write(
              1,
              1,
              12
            );


            pbus_write(
              2,
              1,
              0
            );

          };


          // ====================================================
          // TONE
          // ====================================================

          auto tone_program =
              [&](uint16_t k) {

            /*
             * digital_scale = 63
             *
             * (-63 mod 256) << 10
             *
             * 0xC1 << 10
             * =
             * 0x00030400
             */

            constexpr uint32_t SCALE =
                0x00030400u;


            uint32_t old =
                rd32(
                  TONE1
                );


            uint32_t slot =
                (
                  old
                  &
                  0xF0000000u
                );


            slot |=
                SCALE;


            slot |=
                (
                  (uint32_t)k
                  &
                  K_MASK
                );


            /*
             * mode normal = 1
             * donc bit18.
             */

            slot |=
                GATE_MASK;


            memw();


            wr32(
              TONE1,
              slot
            );


            memw();


            /*
             * Slots 2 / 3:
             * gate OFF.
             */

            uint32_t r;


            r =
                rd32(
                  TONE2
                );


            r &=
                ~GATE_MASK;


            wr32(
              TONE2,
              r
            );


            memw();


            r =
                rd32(
                  TONE3
                );


            r &=
                ~GATE_MASK;


            wr32(
              TONE3,
              r
            );


            memw();

          };


          // ====================================================
          // CHANGE K
          // ====================================================

          auto tone_set_k =
              [&](uint16_t k) {

            uint32_t r =
                rd32(
                  TONE1
                );


            r &=
                ~K_MASK;


            r |=
                (
                  (uint32_t)k
                  &
                  K_MASK
                );


            memw();


            wr32(
              TONE1,
              r
            );


            memw();

          };


          // ====================================================
          // GATE OFF
          // ====================================================

          auto gate_off =
              [&]() {

            uint32_t r =
                rd32(
                  TONE1
                );


            r &=
                ~GATE_MASK;


            memw();


            wr32(
              TONE1,
              r
            );


            memw();

          };


          // ====================================================
          // GATE TEST
          // ====================================================

          auto gate_test =
              [&]() {

            uint32_t before =
                rd32(
                  TONE1
                );


            uint32_t wanted =
                before
                |
                GATE_MASK;


            uint32_t locked;


            /*
             * Important:
             *
             * on vérifie immédiatement si le
             * bit18 tient réellement.
             */

            noInterrupts();


            memw();


            wr32(
              TONE1,
              wanted
            );


            memw();


            locked =
                rd32(
                  TONE1
                );


            memw();


            interrupts();


            delayMicroseconds(
              10
            );


            uint32_t r10 =
                rd32(
                  TONE1
                );


            delayMicroseconds(
              90
            );


            uint32_t r100 =
                rd32(
                  TONE1
                );


            delayMicroseconds(
              900
            );


            uint32_t r1000 =
                rd32(
                  TONE1
                );


            char b[220];


            snprintf(
              b,
              sizeof(b),

              "GATE TEST WANT=%08X LOCK=%08X 10us=%08X 100us=%08X 1ms=%08X",

              (unsigned int)wanted,

              (unsigned int)locked,

              (unsigned int)r10,

              (unsigned int)r100,

              (unsigned int)r1000
            );


            send(b);

          };


          // ====================================================
          // PARSER
          // ====================================================

          for (
            uint8_t c
            :
            bytes
          ) {


            /*
             * Echo
             */

            if (
              c >= 32
              &&
              c <= 126
            ) {

              id(usb_serial).write_byte(c);

            }


            // ==================================================
            // ENTER
            // ==================================================

            if (
              c == '\r'
              ||
              c == '\n'
            ) {


              if (
                line.length() == 0
              ) {

                continue;

              }


              id(usb_serial).write_str(
                "\r\n"
              );


              String cmd =
                  line;


              line =
                  "";


              cmd.trim();

              cmd.toUpperCase();


              // ================================================
              // PHY
              // ================================================

              if (
                cmd == "PHY"
              ) {


                phy_start();


                continue;

              }


              // ================================================
              // ON
              // ================================================

              if (
                cmd == "ON"
              ) {


                if (
                  !phy_ready
                ) {

                  send(
                    "PHY NOT READY -> START"
                  );


                  phy_start();

                }


                send(
                  "RF: ENTER MANUAL PBUS"
                );


                enter_manual();


                trace(
                  "A AFTER DEBUG"
                );


                if (
                  !tx_path_on()
                ) {


                  send(
                    "ERR TX PATH"
                  );


                  gate_off();

                  tx_path_off();

                  leave_manual();


                  tx_active =
                      false;


                  continue;

                }


                trace(
                  "B AFTER TXPATH"
                );


                send(
                  "RF: TX CLOCK ON"
                );


                set_txclk(
                  1
                );


                trace(
                  "C AFTER TXCLK"
                );


                send(
                  "RF: PROGRAM TONE"
                );


                tone_program(
                  current_k
                );


                trace(
                  "D AFTER TONE"
                );


                tx_active =
                    true;


                gate_test();


                trace(
                  "E AFTER GATE TEST"
                );


                uint32_t slot =
                    rd32(
                      TONE1
                    );


                char b[100];


                snprintf(
                  b,
                  sizeof(b),

                  "ON COMPLETE K=%u SLOT=%08X GATE=%u",

                  current_k,

                  (unsigned int)slot,

                  (
                    slot
                    &
                    GATE_MASK
                  )
                    ? 1
                    : 0
                );


                send(b);


                continue;

              }


              // ================================================
              // OFF
              // ================================================

              if (
                cmd == "OFF"
              ) {


                gate_off();


                set_txclk(
                  0
                );


                tx_path_off();


                leave_manual();


                tx_active =
                    false;


                trace(
                  "OFF FINAL"
                );


                send(
                  "OK RF OFF"
                );


                /*
                 * IMPORTANT:
                 *
                 * on ne fait PAS
                 *
                 * wifi_set_opmode_current(NULL_MODE)
                 *
                 * parce que cela couperait de nouveau le PHY.
                 */


                continue;

              }


              // ================================================
              // K n
              // ================================================

              if (
                cmd.startsWith(
                  "K "
                )
              ) {


                String a =
                    cmd.substring(
                      2
                    );


                a.trim();


                long value =
                    a.toInt();


                if (
                  value < 0
                  ||
                  value > 1023
                ) {


                  send(
                    "ERR K 0..1023"
                  );


                  continue;

                }


                current_k =
                    (uint16_t)value;


                if (
                  tx_active
                ) {

                  tone_set_k(
                    current_k
                  );

                }


                char b[40];


                snprintf(
                  b,
                  sizeof(b),

                  "OK K=%u",

                  current_k
                );


                send(b);


                continue;

              }


              // ================================================
              // STATUS
              // ================================================

              if (
                cmd == "STATUS"
              ) {


                uint32_t slot =
                    rd32(
                      TONE1
                    );


                uint32_t pcmd =
                    rd32(
                      PBUS_CMD
                    );


                uint32_t pst =
                    rd32(
                      PBUS_STATUS
                    );


                uint32_t rx =
                    rd32(
                      RX_CTRL
                    );


                char b[220];


                snprintf(
                  b,
                  sizeof(b),

                  "PHY=%u TX=%u K=%u HW_K=%u GATE=%u DBG=%u RXSTOP=%u BUSY=%u",

                  phy_ready
                    ? 1
                    : 0,

                  tx_active
                    ? 1
                    : 0,

                  current_k,

                  (unsigned int)(
                    slot
                    &
                    K_MASK
                  ),

                  (
                    slot
                    &
                    GATE_MASK
                  )
                    ? 1
                    : 0,

                  (
                    pcmd
                    &
                    1u
                  )
                    ? 1
                    : 0,

                  (
                    rx
                    &
                    RX_STOP
                  )
                    ? 1
                    : 0,

                  (
                    pst
                    &
                    0x80000000u
                  )
                    ? 1
                    : 0
                );


                send(b);


                snprintf(
                  b,
                  sizeof(b),

                  "SLOT=%08X PBUS_CMD=%08X PBUS_STATUS=%08X RXCTRL=%08X",

                  (unsigned int)slot,

                  (unsigned int)pcmd,

                  (unsigned int)pst,

                  (unsigned int)rx
                );


                send(b);


                continue;

              }


              // ================================================
              // HELP
              // ================================================

              if (
                cmd == "HELP"
              ) {


                send("");

                send(
                  "ESP8266 RF DEBUG"
                );

                send(
                  "----------------"
                );

                send(
                  "PHY      initialize RF/PHY on channel 6"
                );

                send(
                  "ON       start RF tone diagnostic"
                );

                send(
                  "OFF      stop RF tone"
                );

                send(
                  "K n      tone control 0..1023"
                );

                send(
                  "STATUS   dump registers"
                );

                send(
                  "HELP"
                );


                continue;

              }


              send(
                "ERR UNKNOWN"
              );

            }


            // ==================================================
            // CARACTERE
            // ==================================================

            else if (
              c >= 32
              &&
              c <= 126
            ) {


              if (
                line.length()
                <
                63
              ) {

                line +=
                    (char)c;

              }

            }

          }