esphome:
  name: wemo-test
  friendly_name: WEMO-TEST
  includes:
    - <user_interface.h>
  platformio_options:
    board_build.f_cpu: 160000000L

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: NONE

globals:
  - { id: current_k, type: uint16_t, restore_value: no, initial_value: '8' }
  - { id: current_ask, type: uint8_t, restore_value: no, initial_value: '63' }
  - { id: current_apwr, type: uint8_t, restore_value: no, initial_value: '255' }
  - { id: current_channel, type: uint8_t, restore_value: no, initial_value: '6' }
  - { id: phy_ready, type: bool, restore_value: no, initial_value: 'false' }
  - { id: tx_active, type: bool, restore_value: no, initial_value: 'false' }

  - { id: sweep_active, type: bool, restore_value: no, initial_value: 'false' }
  - { id: sweep_min, type: uint16_t, restore_value: no, initial_value: '0' }
  - { id: sweep_max, type: uint16_t, restore_value: no, initial_value: '1023' }
  - { id: sweep_k, type: uint16_t, restore_value: no, initial_value: '0' }
  - { id: sweep_dir, type: int, restore_value: no, initial_value: '1' }
  - { id: sweep_step, type: uint16_t, restore_value: no, initial_value: '16' }
  - { id: sweep_dwell_ms, type: uint32_t, restore_value: no, initial_value: '1' }
  - { id: sweep_next_ms, type: uint32_t, restore_value: no, initial_value: '0' }

  - { id: ultimate_active, type: bool, restore_value: no, initial_value: 'false' }
  - { id: ultimate_state, type: uint8_t, restore_value: no, initial_value: '0' }
  - { id: ultimate_channel, type: uint8_t, restore_value: no, initial_value: '1' }
  - { id: ultimate_k, type: uint16_t, restore_value: no, initial_value: '0' }
  - { id: ultimate_step, type: uint16_t, restore_value: no, initial_value: '8' }
  - { id: ultimate_dwell_ms, type: uint32_t, restore_value: no, initial_value: '1' }
  - { id: ultimate_next_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: ultimate_deadline_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: ultimate_pass, type: uint16_t, restore_value: no, initial_value: '1' }
  - { id: ultimate_passes, type: uint16_t, restore_value: no, initial_value: '3' }
  - { id: ultimate_apwr, type: uint8_t, restore_value: no, initial_value: '255' }

uart:
  id: usb_serial
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          static String line = "";

          constexpr uint32_t TONE1=0x600005B8u, TONE2=0x600005BCu, TONE3=0x600005C4u;
          constexpr uint32_t K_MASK=0x000003FFu, SCALE_MASK=0x0003FC00u, GATE_MASK=0x00040000u;
          constexpr uint32_t SCALE_SHIFT=10u;
          constexpr uint32_t PBUS_CMD=0x60000594u, PBUS_STATUS=0x600005A0u;
          constexpr uint32_t RX_CTRL=0x60009B08u, RX_STOP=0x08000000u;
          constexpr uint32_t ROM_SET_TXCLK_EN=0x4000650Cu;
          constexpr uint32_t ROM_SET_ANA_INF_TX_SCALE=0x4000678Cu;

          using SetTxClkFn=void (*)(int);
          using SetAnaScaleFn=uint8_t (*)(uint8_t);
          auto set_txclk=reinterpret_cast<SetTxClkFn>(ROM_SET_TXCLK_EN);
          auto set_ana_scale=reinterpret_cast<SetAnaScaleFn>(ROM_SET_ANA_INF_TX_SCALE);

          auto memw=[](){ __asm__ volatile("memw" ::: "memory"); };
          auto rd32=[](uint32_t a)->uint32_t{ return *(volatile uint32_t*)a; };
          auto wr32=[](uint32_t a,uint32_t v){ *(volatile uint32_t*)a=v; };
          auto send=[&](const char *s){ id(usb_serial).write_str(s); id(usb_serial).write_str("\r\n"); };
          auto ch2mhz=[](uint8_t ch)->int{
            if(ch>=1 && ch<=13) return 2412+5*((int)ch-1);
            if(ch==14) return 2484;
            return -1;
          };
          auto mhz2ch=[](int mhz)->int{
            if(mhz==2484) return 14;
            if(mhz<2412 || mhz>2472) return -1;
            int d=mhz-2412;
            if(d%5) return -1;
            int ch=1+d/5;
            return (ch>=1 && ch<=13)?ch:-1;
          };
          auto ask_code=[](uint8_t s)->uint8_t{ return (uint8_t)(0u-s); };
          auto hw_ask=[&](uint32_t slot)->uint8_t{
            uint8_t code=(uint8_t)((slot>>SCALE_SHIFT)&0xffu);
            return (uint8_t)(0u-code);
          };

          auto pbus_write=[&](uint8_t sel,uint8_t bank,uint16_t value)->bool{
            uint32_t cmd=rd32(PBUS_CMD);
            cmd &= 0xFFFF0001u;
            cmd |= ((uint32_t)(bank&3u)<<14);
            cmd |= ((uint32_t)(value&0x1ffu)<<5);
            cmd |= ((uint32_t)(sel&7u)<<2);
            cmd |= 2u;
            memw(); wr32(PBUS_CMD,cmd); memw();
            uint32_t t0=micros();
            while(rd32(PBUS_STATUS)&0x80000000u){
              if((uint32_t)(micros()-t0)>2000u){
                uint32_t r=rd32(PBUS_CMD); r&=~2u; wr32(PBUS_CMD,r); memw(); return false;
              }
            }
            uint32_t r=rd32(PBUS_CMD); r&=~2u; wr32(PBUS_CMD,r); memw();
            return true;
          };
          auto enter_manual=[&](){
            uint32_t r=rd32(RX_CTRL); r|=RX_STOP; wr32(RX_CTRL,r); memw();
            r=rd32(PBUS_CMD); r|=1u; wr32(PBUS_CMD,r); memw();
          };
          auto leave_manual=[&](){
            uint32_t r=rd32(PBUS_CMD); r&=~1u; wr32(PBUS_CMD,r); memw();
            r=rd32(RX_CTRL); r&=~RX_STOP; wr32(RX_CTRL,r); memw();
          };
          auto tx_path_on=[&]()->bool{
            if(!pbus_write(2,1,1)) return false;
            if(!pbus_write(7,1,95)) return false;
            if(!pbus_write(1,1,127)) return false;
            if(!pbus_write(6,1,127)) return false;
            return true;
          };
          auto tx_path_off=[&](){ pbus_write(6,1,0); pbus_write(1,1,12); pbus_write(2,1,0); };
          auto apply_apwr=[&](uint8_t x)->uint8_t{ memw(); uint8_t r=set_ana_scale(x); memw(); return r; };
          auto tone_program=[&](uint16_t k,uint8_t ask){
            uint32_t slot=rd32(TONE1)&0xF0000000u;
            slot |= ((uint32_t)k & K_MASK);
            slot |= ((uint32_t)ask_code(ask)<<SCALE_SHIFT);
            slot |= GATE_MASK;
            memw(); wr32(TONE1,slot); memw();
            uint32_t r=rd32(TONE2); r&=~GATE_MASK; wr32(TONE2,r); memw();
            r=rd32(TONE3); r&=~GATE_MASK; wr32(TONE3,r); memw();
          };
          auto tone_set_k=[&](uint16_t k){
            uint32_t r=rd32(TONE1); r&=~K_MASK; r|=((uint32_t)k&K_MASK); memw(); wr32(TONE1,r); memw();
          };
          auto tone_set_ask=[&](uint8_t ask){
            uint32_t r=rd32(TONE1); r&=~SCALE_MASK; r|=((uint32_t)ask_code(ask)<<SCALE_SHIFT); memw(); wr32(TONE1,r); memw();
          };
          auto gate_on=[&](){ uint32_t r=rd32(TONE1); r|=GATE_MASK; wr32(TONE1,r); memw(); };
          auto gate_off=[&](){ uint32_t r=rd32(TONE1); r&=~GATE_MASK; wr32(TONE1,r); memw(); };
          auto tx_start=[&](uint16_t k,uint8_t ask,uint8_t apwr)->bool{
            enter_manual();
            if(!tx_path_on()){ leave_manual(); return false; }
            apply_apwr(apwr);
            set_txclk(1);
            tone_program(k,ask);
            return true;
          };
          auto tx_stop=[&](){ gate_off(); set_txclk(0); tx_path_off(); leave_manual(); };

          auto set_channel=[&](uint8_t ch)->bool{
            if(ch<1 || ch>14){ send("ERR CH 1..14"); return false; }
            bool ok=wifi_set_channel(ch);
            if(!ok){ char b[96]; snprintf(b,sizeof(b),"ERR wifi_set_channel CH=%u",ch); send(b); return false; }
            delay(100);
            id(current_channel)=wifi_get_channel();
            char b[96]; snprintf(b,sizeof(b),"OK CH=%u CENTER=%d MHz",id(current_channel),ch2mhz(id(current_channel))); send(b);
            return true;
          };
          auto phy_start=[&](){
            if(id(phy_ready)){ send("PHY ALREADY READY"); return; }
            send("PHY: START");
            wifi_station_set_auto_connect(0);
            bool mode_ok=wifi_set_opmode_current(STATION_MODE);
            { char b[64]; snprintf(b,sizeof(b),"PHY: STATION_MODE=%u",mode_ok?1:0); send(b); }
            delay(500);
            wifi_station_disconnect();
            bool sleep_ok=wifi_set_sleep_type(NONE_SLEEP_T);
            { char b[64]; snprintf(b,sizeof(b),"PHY: NONE_SLEEP=%u",sleep_ok?1:0); send(b); }
            if(!set_channel(id(current_channel))){ send("PHY: CHANNEL INIT FAILED"); return; }
            delay(100);
            id(phy_ready)=true;
            send("PHY: READY");
          };
          auto stop_all=[&](){
            id(sweep_active)=false;
            id(ultimate_active)=false;
            id(ultimate_state)=0;
            if(id(tx_active)){ tx_stop(); id(tx_active)=false; }
          };

          for(uint8_t c:bytes){
            if(c>=32 && c<=126) id(usb_serial).write_byte(c);
            if(c=='\r' || c=='\n'){
              if(line.length()==0) continue;
              id(usb_serial).write_str("\r\n");
              String cmd=line; line=""; cmd.trim(); cmd.toUpperCase();

              if(cmd=="PHY"){ phy_start(); continue; }

              if(cmd.startsWith("CH ")){
                if(id(tx_active)||id(ultimate_active)){ send("ERR OFF FIRST"); continue; }
                if(!id(phy_ready)) phy_start();
                long ch=cmd.substring(3).toInt();
                if(ch<1||ch>14){ send("ERR CH 1..14"); continue; }
                set_channel((uint8_t)ch); continue;
              }

              if(cmd.startsWith("FREQ ")){
                if(id(tx_active)||id(ultimate_active)){ send("ERR OFF FIRST"); continue; }
                if(!id(phy_ready)) phy_start();
                int mhz=cmd.substring(5).toInt();
                int ch=mhz2ch(mhz);
                if(ch<1){ send("ERR FREQ 2412..2472 STEP5 OR 2484"); continue; }
                set_channel((uint8_t)ch); continue;
              }

              if(cmd=="ON"){
                if(!id(phy_ready)) phy_start();
                if(id(tx_active)){ send("TX ALREADY ON"); continue; }
                id(sweep_active)=false; id(ultimate_active)=false;
                if(!tx_start(id(current_k),id(current_ask),id(current_apwr))){ send("ERR TX START"); continue; }
                id(tx_active)=true;
                char b[180]; snprintf(b,sizeof(b),"RF ON CH=%u CENTER=%dMHz K=%u ASK=%u APWR=%u SLOT=%08X",id(current_channel),ch2mhz(id(current_channel)),id(current_k),id(current_ask),id(current_apwr),(unsigned int)rd32(TONE1)); send(b);
                continue;
              }

              if(cmd=="OFF"){ stop_all(); send("OK RF OFF"); continue; }

              if(cmd.startsWith("K ")){
                long v=cmd.substring(2).toInt();
                if(v<0||v>1023){ send("ERR K 0..1023"); continue; }
                id(sweep_active)=false; id(current_k)=(uint16_t)v;
                if(id(tx_active)) tone_set_k(id(current_k));
                char b[48]; snprintf(b,sizeof(b),"OK K=%u",id(current_k)); send(b); continue;
              }

              if(cmd.startsWith("ASK ")){
                long v=cmd.substring(4).toInt();
                if(v<0||v>63){ send("ERR ASK 0..63"); continue; }
                id(current_ask)=(uint8_t)v;
                if(id(tx_active)) tone_set_ask(id(current_ask));
                char b[80]; snprintf(b,sizeof(b),"OK ASK=%u SCALE_CODE=0x%02X",id(current_ask),ask_code(id(current_ask))); send(b); continue;
              }

              if(cmd.startsWith("APWR ")){
                long v=cmd.substring(5).toInt();
                if(v<0||v>255){ send("ERR APWR 0..255"); continue; }
                if(!id(phy_ready)) phy_start();
                id(current_apwr)=(uint8_t)v;
                uint8_t dret=apply_apwr(id(current_apwr));
                uint8_t acode=(id(current_apwr)<64)?0:(uint8_t)(63u-id(current_apwr));
                char b[160]; snprintf(b,sizeof(b),"OK APWR=%u ANALOG_CODE=0x%02X ROM_DIGITAL=%u ASK=%u",id(current_apwr),acode,dret,id(current_ask)); send(b); continue;
              }

              if(cmd=="OOK 0"){
                if(!id(tx_active)){ send("ERR TX MUST BE ON"); continue; }
                gate_off(); send("OK OOK=0"); continue;
              }
              if(cmd=="OOK 1"){
                if(!id(tx_active)){ send("ERR TX MUST BE ON"); continue; }
                gate_on(); send("OK OOK=1"); continue;
              }

              if(cmd.startsWith("KSWEEP ")){
                long a=-1,b=-1; int n=sscanf(cmd.c_str(),"KSWEEP %ld %ld",&a,&b);
                if(n!=2||a<0||b<0||a>1023||b>1023||a>b){ send("ERR KSWEEP min max (0..1023)"); continue; }
                id(sweep_min)=(uint16_t)a; id(sweep_max)=(uint16_t)b; id(sweep_k)=id(sweep_min); id(sweep_dir)=1;
                char out[96]; snprintf(out,sizeof(out),"OK KSWEEP=%u..%u",id(sweep_min),id(sweep_max)); send(out); continue;
              }

              if(cmd.startsWith("KSTEP ")){
                long v=cmd.substring(6).toInt();
                if(v<1||v>1023){ send("ERR KSTEP 1..1023"); continue; }
                id(sweep_step)=(uint16_t)v;
                char b[64]; snprintf(b,sizeof(b),"OK KSTEP=%u",id(sweep_step)); send(b); continue;
              }

              if(cmd.startsWith("DWELL ")){
                long v=cmd.substring(6).toInt();
                if(v<1||v>60000){ send("ERR DWELL 1..60000 ms"); continue; }
                id(sweep_dwell_ms)=(uint32_t)v;
                char b[64]; snprintf(b,sizeof(b),"OK DWELL=%lu ms",(unsigned long)id(sweep_dwell_ms)); send(b); continue;
              }

              if(cmd=="SWEEP ON"){
                if(!id(tx_active)){ send("ERR TX MUST BE ON"); continue; }
                id(ultimate_active)=false; id(sweep_k)=id(sweep_min); id(sweep_dir)=1; id(sweep_next_ms)=millis(); id(sweep_active)=true;
                char b[128]; snprintf(b,sizeof(b),"OK SWEEP ON K=%u..%u STEP=%u DWELL=%lums",id(sweep_min),id(sweep_max),id(sweep_step),(unsigned long)id(sweep_dwell_ms)); send(b); continue;
              }
              if(cmd=="SWEEP OFF"){ id(sweep_active)=false; send("OK SWEEP OFF"); continue; }

              if(cmd.startsWith("USTEP ")){
                long v=cmd.substring(6).toInt();
                if(v<1||v>1023){ send("ERR USTEP 1..1023"); continue; }
                id(ultimate_step)=(uint16_t)v;
                char b[64]; snprintf(b,sizeof(b),"OK USTEP=%u",id(ultimate_step)); send(b); continue;
              }

              if(cmd.startsWith("UDWELL ")){
                long v=cmd.substring(7).toInt();
                if(v<1||v>60000){ send("ERR UDWELL 1..60000 ms"); continue; }
                id(ultimate_dwell_ms)=(uint32_t)v;
                char b[64]; snprintf(b,sizeof(b),"OK UDWELL=%lu ms",(unsigned long)id(ultimate_dwell_ms)); send(b); continue;
              }

              if(cmd.startsWith("UPASSES ")){
                long v=cmd.substring(8).toInt();
                if(v<1||v>100){ send("ERR UPASSES 1..100"); continue; }
                id(ultimate_passes)=(uint16_t)v;
                char b[64]; snprintf(b,sizeof(b),"OK UPASSES=%u",id(ultimate_passes)); send(b); continue;
              }

              if(cmd.startsWith("UAPWR ")){
                long v=cmd.substring(6).toInt();
                if(v<0||v>255){ send("ERR UAPWR 0..255"); continue; }
                id(ultimate_apwr)=(uint8_t)v;
                char b[64]; snprintf(b,sizeof(b),"OK UAPWR=%u",id(ultimate_apwr)); send(b); continue;
              }

              if(cmd=="ULTIMATE ON"){
                if(!id(phy_ready)) phy_start();
                stop_all();
                id(ultimate_channel)=1; id(ultimate_k)=0; id(ultimate_pass)=1; id(ultimate_state)=1; id(ultimate_active)=true;
                char b[220]; snprintf(b,sizeof(b),"ULTIMATE START CH=1..14 K=0..1023 STEP=%u DWELL=%lums PASSES=%u APWR=%u ASK=63+0",id(ultimate_step),(unsigned long)id(ultimate_dwell_ms),id(ultimate_passes),id(ultimate_apwr)); send(b); continue;
              }

              if(cmd=="ULTIMATE OFF"){ stop_all(); send("OK ULTIMATE OFF / RF OFF"); continue; }

              if(cmd=="STATUS"){
                uint32_t slot=rd32(TONE1); uint8_t hwch=wifi_get_channel();
                char b[400];
                snprintf(b,sizeof(b),"PHY=%u TX=%u CH=%u CENTER=%dMHz K=%u HW_K=%u ASK=%u HW_ASK=%u APWR=%u GATE=%u SWEEP=%u RANGE=%u..%u STEP=%u DWELL=%lums ULT=%u USTATE=%u UCH=%u UPASS=%u/%u USTEP=%u UDWELL=%lums UAPWR=%u SLOT=%08X",
                  id(phy_ready)?1:0,id(tx_active)?1:0,hwch,ch2mhz(hwch),id(current_k),(unsigned int)(slot&K_MASK),id(current_ask),hw_ask(slot),id(current_apwr),(slot&GATE_MASK)?1:0,id(sweep_active)?1:0,id(sweep_min),id(sweep_max),id(sweep_step),(unsigned long)id(sweep_dwell_ms),id(ultimate_active)?1:0,id(ultimate_state),id(ultimate_channel),id(ultimate_pass),id(ultimate_passes),id(ultimate_step),(unsigned long)id(ultimate_dwell_ms),id(ultimate_apwr),(unsigned int)slot);
                send(b); continue;
              }

              if(cmd=="HELP"){
                send("");
                send("ESP8266 RF ULTIMATE LAB");
                send("PHY");
                send("CH n              1..14");
                send("FREQ MHz          2412..2472 step5 or 2484");
                send("K n               0..1023");
                send("ASK n             0..63");
                send("APWR n            0..255");
                send("OOK 0 / OOK 1");
                send("ON / OFF");
                send("KSWEEP min max");
                send("KSTEP n           1..1023");
                send("DWELL ms          1..60000");
                send("SWEEP ON / SWEEP OFF");
                send("USTEP n           1..1023");
                send("UDWELL ms         1..60000");
                send("UPASSES n         1..100");
                send("UAPWR n           0..255");
                send("ULTIMATE ON / ULTIMATE OFF");
                send("STATUS / HELP");
                continue;
              }

              send("ERR UNKNOWN");
            } else if(c>=32 && c<=126){
              if(line.length()<80) line+=(char)c;
            }
          }

interval:
  - interval: 1ms
    then:
      - lambda: |-
          constexpr uint32_t TONE1=0x600005B8u, TONE2=0x600005BCu, TONE3=0x600005C4u;
          constexpr uint32_t K_MASK=0x000003FFu, SCALE_MASK=0x0003FC00u, GATE_MASK=0x00040000u;
          constexpr uint32_t SCALE_SHIFT=10u;
          constexpr uint32_t PBUS_CMD=0x60000594u, PBUS_STATUS=0x600005A0u;
          constexpr uint32_t RX_CTRL=0x60009B08u, RX_STOP=0x08000000u;
          constexpr uint32_t ROM_SET_TXCLK_EN=0x4000650Cu;
          constexpr uint32_t ROM_SET_ANA_INF_TX_SCALE=0x4000678Cu;

          using SetTxClkFn=void (*)(int);
          using SetAnaScaleFn=uint8_t (*)(uint8_t);
          auto set_txclk=reinterpret_cast<SetTxClkFn>(ROM_SET_TXCLK_EN);
          auto set_ana_scale=reinterpret_cast<SetAnaScaleFn>(ROM_SET_ANA_INF_TX_SCALE);

          auto memw=[](){ __asm__ volatile("memw" ::: "memory"); };
          auto rd32=[](uint32_t a)->uint32_t{ return *(volatile uint32_t*)a; };
          auto wr32=[](uint32_t a,uint32_t v){ *(volatile uint32_t*)a=v; };
          auto send=[&](const char *s){ id(usb_serial).write_str(s); id(usb_serial).write_str("\r\n"); };
          auto ch2mhz=[](uint8_t ch)->int{ if(ch>=1&&ch<=13) return 2412+5*((int)ch-1); if(ch==14) return 2484; return -1; };
          auto ask_code=[](uint8_t s)->uint8_t{ return (uint8_t)(0u-s); };

          auto pbus_write=[&](uint8_t sel,uint8_t bank,uint16_t value)->bool{
            uint32_t cmd=rd32(PBUS_CMD);
            cmd&=0xFFFF0001u;
            cmd|=((uint32_t)(bank&3u)<<14);
            cmd|=((uint32_t)(value&0x1ffu)<<5);
            cmd|=((uint32_t)(sel&7u)<<2);
            cmd|=2u;
            memw(); wr32(PBUS_CMD,cmd); memw();
            uint32_t t0=micros();
            while(rd32(PBUS_STATUS)&0x80000000u){
              if((uint32_t)(micros()-t0)>2000u){ uint32_t r=rd32(PBUS_CMD); r&=~2u; wr32(PBUS_CMD,r); memw(); return false; }
            }
            uint32_t r=rd32(PBUS_CMD); r&=~2u; wr32(PBUS_CMD,r); memw(); return true;
          };
          auto enter_manual=[&](){ uint32_t r=rd32(RX_CTRL); r|=RX_STOP; wr32(RX_CTRL,r); memw(); r=rd32(PBUS_CMD); r|=1u; wr32(PBUS_CMD,r); memw(); };
          auto leave_manual=[&](){ uint32_t r=rd32(PBUS_CMD); r&=~1u; wr32(PBUS_CMD,r); memw(); r=rd32(RX_CTRL); r&=~RX_STOP; wr32(RX_CTRL,r); memw(); };
          auto tx_path_on=[&]()->bool{ return pbus_write(2,1,1)&&pbus_write(7,1,95)&&pbus_write(1,1,127)&&pbus_write(6,1,127); };
          auto tx_path_off=[&](){ pbus_write(6,1,0); pbus_write(1,1,12); pbus_write(2,1,0); };
          auto apply_apwr=[&](uint8_t x)->uint8_t{ memw(); uint8_t r=set_ana_scale(x); memw(); return r; };
          auto tone_program=[&](uint16_t k,uint8_t ask){
            uint32_t slot=rd32(TONE1)&0xF0000000u;
            slot|=((uint32_t)k&K_MASK);
            slot|=((uint32_t)ask_code(ask)<<SCALE_SHIFT);
            slot|=GATE_MASK;
            memw(); wr32(TONE1,slot); memw();
            uint32_t r=rd32(TONE2); r&=~GATE_MASK; wr32(TONE2,r); memw();
            r=rd32(TONE3); r&=~GATE_MASK; wr32(TONE3,r); memw();
          };
