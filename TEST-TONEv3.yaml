esphome:
  name: wemo-test
  friendly_name: WEMO-TEST

  includes:
    - <user_interface.h>

  platformio_options:
    board_build.f_cpu: 160000000L


esp8266:
  board: d1_mini


logger:
  baud_rate: 0
  level: NONE


uart:
  id: usb_serial

  tx_pin: GPIO1
  rx_pin: GPIO3

  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

  rx_buffer_size: 256

  debug:
    direction: RX
    dummy_receiver: true

    after:
      timeout: 20ms

    sequence:
      - lambda: |-

          static String line = "";

          // ====================================================
          // ETAT
          // ====================================================

          static uint16_t current_k = 8;

          // Scale numerique ASK.
          static uint8_t current_ask = 63;

          // Parametre brut passe a rom_set_ana_inf_tx_scale().
          static uint8_t current_apwr = 63;

          // Ne reprogramme l'analogique au ON que si APWR
          // a effectivement ete utilise.
          static bool apwr_configured = false;

          static uint8_t current_channel = 6;

          static bool phy_ready = false;
          static bool tx_active = false;


          // ====================================================
          // TONE REGISTERS
          // ====================================================

          constexpr uint32_t TONE1 =
              0x600005B8u;

          constexpr uint32_t TONE2 =
              0x600005BCu;

          constexpr uint32_t TONE3 =
              0x600005C4u;


          constexpr uint32_t K_MASK =
              0x000003FFu;


          constexpr uint32_t SCALE_MASK =
              0x0003FC00u;

          constexpr uint32_t SCALE_SHIFT =
              10u;


          constexpr uint32_t GATE_MASK =
              0x00040000u;


          // ====================================================
          // PBUS
          // ====================================================

          constexpr uint32_t PBUS_CMD =
              0x60000594u;

          constexpr uint32_t PBUS_STATUS =
              0x600005A0u;


          constexpr uint32_t RX_CTRL =
              0x60009B08u;

          constexpr uint32_t RX_STOP =
              0x08000000u;


          // ====================================================
          // ROM
          // ====================================================

          constexpr uint32_t ROM_SET_TXCLK_EN =
              0x4000650Cu;

          constexpr uint32_t ROM_SET_ANA_INF_TX_SCALE =
              0x4000678Cu;


          using SetTxClkFn =
              void (*)(int);

          using SetAnaScaleFn =
              uint8_t (*)(uint8_t);


          auto set_txclk =
              reinterpret_cast<SetTxClkFn>(
                ROM_SET_TXCLK_EN
              );


          auto set_ana_scale =
              reinterpret_cast<SetAnaScaleFn>(
                ROM_SET_ANA_INF_TX_SCALE
              );


          // ====================================================
          // MMIO
          // ====================================================

          auto memw = []() {

            __asm__ volatile(
              "memw"
              ::: "memory"
            );

          };


          auto rd32 =
              [](uint32_t addr) -> uint32_t {

            return
              *(volatile uint32_t *) addr;

          };


          auto wr32 =
              [](uint32_t addr,
                 uint32_t value) {

            *(volatile uint32_t *) addr =
                value;

          };


          // ====================================================
          // SERIAL
          // ====================================================

          auto send =
              [&](const char *s) {

            id(usb_serial).write_str(s);

            id(usb_serial).write_str(
              "\r\n"
            );

          };


          // ====================================================
          // CHANNEL <-> FREQUENCY
          // ====================================================

          auto channel_to_mhz =
              [](uint8_t ch) -> int {

            if (
              ch >= 1
              &&
              ch <= 13
            ) {

              return
                2412
                +
                5 * ((int)ch - 1);

            }

            return -1;

          };


          auto mhz_to_channel =
              [](int mhz) -> int {

            if (
              mhz < 2412
              ||
              mhz > 2472
            ) {

              return -1;

            }


            int delta =
                mhz - 2412;


            if (
              (delta % 5)
              != 0
            ) {

              return -1;

            }


            int ch =
                1 + delta / 5;


            if (
              ch < 1
              ||
              ch > 13
            ) {

              return -1;

            }


            return ch;

          };


          // ====================================================
          // ASK ENCODING
          //
          // scale 0..63
          //
          // field = ((-scale) & 0xFF) << 10
          // ====================================================

          auto ask_code =
              [](uint8_t scale) -> uint8_t {

            return
              (uint8_t)(
                0u - scale
              );

          };


          auto get_hw_ask =
              [&](uint32_t slot) -> uint8_t {

            uint8_t code =
                (uint8_t)(
                  (slot >> SCALE_SHIFT)
                  &
                  0xFFu
                );


            return
              (uint8_t)(
                0u - code
              );

          };


          // ====================================================
          // TRACE
          // ====================================================

          auto trace =
              [&](const char *tag) {

            uint32_t slot =
                rd32(TONE1);


            char b[220];


            snprintf(
              b,
              sizeof(b),

              "%s SLOT=%08X K=%u ASK=%u GATE=%u APWR=%u",

              tag,

              (unsigned int)slot,

              (unsigned int)(
                slot & K_MASK
              ),

              (unsigned int)(
                get_hw_ask(slot)
              ),

              (slot & GATE_MASK)
                ? 1
                : 0,

              current_apwr
            );


            send(b);

          };


          // ====================================================
          // CHANNEL
          // ====================================================

          auto set_channel =
              [&](uint8_t ch) -> bool {

            if (
              ch < 1
              ||
              ch > 13
            ) {

              send(
                "ERR CHANNEL 1..13"
              );

              return false;

            }


            bool ok =
                wifi_set_channel(
                  ch
                );


            if (!ok) {

              send(
                "ERR wifi_set_channel"
              );

              return false;

            }


            delay(100);


            current_channel =
                wifi_get_channel();


            char b[100];


            snprintf(
              b,
              sizeof(b),

              "OK CH=%u CENTER=%d MHz",

              current_channel,

              channel_to_mhz(
                current_channel
              )
            );


            send(b);


            return true;

          };


          // ====================================================
          // PHY START
          // ====================================================

          auto phy_start =
              [&]() {

            if (phy_ready) {

              send(
                "PHY ALREADY READY"
              );

              return;

            }


            send(
              "PHY: START"
            );


            wifi_station_set_auto_connect(
              0
            );


            bool mode_ok =
                wifi_set_opmode_current(
                  STATION_MODE
                );


            {
              char b[80];

              snprintf(
                b,
                sizeof(b),

                "PHY: STATION_MODE=%u",

                mode_ok ? 1 : 0
              );

              send(b);
            }


            delay(500);


            wifi_station_disconnect();


            bool sleep_ok =
                wifi_set_sleep_type(
                  NONE_SLEEP_T
                );


            {
              char b[80];

              snprintf(
                b,
                sizeof(b),

                "PHY: NONE_SLEEP=%u",

                sleep_ok ? 1 : 0
              );

              send(b);
            }


            if (
              !set_channel(
                current_channel
              )
            ) {

              send(
                "PHY: CHANNEL INIT FAILED"
              );

              return;

            }


            delay(100);


            phy_ready = true;


            send(
              "PHY: READY"
            );

          };


          // ====================================================
          // PBUS WRITE
          // ====================================================

          auto pbus_write =
              [&](uint8_t selector,
                  uint8_t bank,
                  uint16_t value) -> bool {

            uint32_t cmd =
                rd32(
                  PBUS_CMD
                );


            cmd &=
                0xFFFF0001u;


            cmd |=
                (
                  (uint32_t)(
                    bank & 3u
                  )
                  << 14
                );


            cmd |=
                (
                  (uint32_t)(
                    value & 0x1FFu
                  )
                  << 5
                );


            cmd |=
                (
                  (uint32_t)(
                    selector & 7u
                  )
                  << 2
                );


            cmd |=
                2u;


            memw();


            wr32(
              PBUS_CMD,
              cmd
            );


            memw();


            uint32_t t0 =
                micros();


            while (
              rd32(PBUS_STATUS)
              &
              0x80000000u
            ) {


              if (
                (uint32_t)(
                  micros() - t0
                )
                >
                2000u
              ) {


                uint32_t r =
                    rd32(
                      PBUS_CMD
                    );


                r &=
                    ~2u;


                wr32(
                  PBUS_CMD,
                  r
                );


                memw();


                return false;

              }

            }


            uint32_t r =
                rd32(
                  PBUS_CMD
                );


            r &=
                ~2u;


            memw();


            wr32(
              PBUS_CMD,
              r
            );


            memw();


            return true;

          };


          // ====================================================
          // MANUAL PBUS
          // ====================================================

          auto enter_manual =
              [&]() {

            uint32_t r;


            r =
                rd32(
                  RX_CTRL
                );


            r |=
                RX_STOP;


            memw();


            wr32(
              RX_CTRL,
              r
            );


            memw();


            r =
                rd32(
                  PBUS_CMD
                );


            r |=
                1u;


            memw();


            wr32(
              PBUS_CMD,
              r
            );


            memw();

          };


          auto leave_manual =
              [&]() {

            uint32_t r;


            r =
                rd32(
                  PBUS_CMD
                );


            r &=
                ~1u;


            wr32(
              PBUS_CMD,
              r
            );


            memw();


            r =
                rd32(
                  RX_CTRL
                );


            r &=
                ~RX_STOP;


            wr32(
              RX_CTRL,
              r
            );


            memw();

          };


          // ====================================================
          // TX RF PATH
          // ====================================================

          auto tx_path_on =
              [&]() -> bool {

            if (
              !pbus_write(
                2,
                1,
                1
              )
            ) {

              return false;

            }


            if (
              !pbus_write(
                7,
                1,
                95
              )
            ) {

              return false;

            }


            /*
             * PBUS(0,1,x) reste preserve.
             */


            if (
              !pbus_write(
                1,
                1,
                127
              )
            ) {

              return false;

            }


            if (
              !pbus_write(
                6,
                1,
                127
              )
            ) {

              return false;

            }


            return true;

          };


          auto tx_path_off =
              [&]() {

            pbus_write(
              6,
              1,
              0
            );


            pbus_write(
              1,
              1,
              12
            );


            pbus_write(
              2,
              1,
              0
            );

          };


          // ====================================================
          // ANALOG POWER / SCALE
          //
          // Appelle reellement:
          //
          // rom_set_ana_inf_tx_scale(x)
          //
          // x < 64:
          //     analog = 0
          //     retour digital = x
          //
          // x >= 64:
          //     analog = (63-x) & 0xFF
          //     retour digital = 63
          //
          // IMPORTANT:
          //
          // Ici on IGNORE volontairement le retour numerique.
          // ASK reste donc totalement independant.
          // ====================================================

          auto apply_apwr =
              [&](uint8_t x) -> uint8_t {

            memw();


            uint8_t digital_return =
                set_ana_scale(
                  x
                );


            memw();


            return
              digital_return;

          };


          // ====================================================
          // INITIAL TONE
          // ====================================================

          auto tone_program =
              [&](uint16_t k,
                  uint8_t scale) {

            uint32_t old =
                rd32(
                  TONE1
                );


            uint32_t slot =
                old
                &
                0xF0000000u;


            // K
            slot |=
                (
                  (uint32_t)k
                  &
                  K_MASK
                );


            // ASK digital scale
            uint8_t code =
                ask_code(
                  scale
                );


            slot |=
                (
                  (uint32_t)code
                  <<
                  SCALE_SHIFT
                );


            // normal tone ON
            slot |=
                GATE_MASK;


            memw();


            wr32(
              TONE1,
              slot
            );


            memw();


            // Other tone slots OFF.
            uint32_t r;


            r =
                rd32(
                  TONE2
                );


            r &=
                ~GATE_MASK;


            wr32(
              TONE2,
              r
            );


            memw();


            r =
                rd32(
                  TONE3
                );


            r &=
                ~GATE_MASK;


            wr32(
              TONE3,
              r
            );


            memw();

          };


          // ====================================================
          // K HOT UPDATE
          // ====================================================

          auto tone_set_k =
              [&](uint16_t k) {

            uint32_t r =
                rd32(
                  TONE1
                );


            r &=
                ~K_MASK;


            r |=
                (
                  (uint32_t)k
                  &
                  K_MASK
                );


            memw();


            wr32(
              TONE1,
              r
            );


            memw();

          };


          // ====================================================
          // ASK HOT UPDATE
          //
          // UNIQUEMENT bits17:10.
          // ====================================================

          auto ask_set_scale =
              [&](uint8_t scale) {

            uint8_t code =
                ask_code(
                  scale
                );


            uint32_t r =
                rd32(
                  TONE1
                );


            r &=
                ~SCALE_MASK;


            r |=
                (
                  (uint32_t)code
                  <<
                  SCALE_SHIFT
                );


            memw();


            wr32(
              TONE1,
              r
            );


            memw();

          };


          // ====================================================
          // GATE OFF
          // ====================================================

          auto gate_off =
              [&]() {

            uint32_t r =
                rd32(
                  TONE1
                );


            r &=
                ~GATE_MASK;


            memw();


            wr32(
              TONE1,
              r
            );


            memw();

          };


          // ====================================================
          // SERIAL PARSER
          // ====================================================

          for (
            uint8_t c
            :
            bytes
          ) {


            if (
              c >= 32
              &&
              c <= 126
            ) {

              id(usb_serial).write_byte(c);

            }


            if (
              c == '\r'
              ||
              c == '\n'
            ) {


              if (
                line.length() == 0
              ) {

                continue;

              }


              id(usb_serial).write_str(
                "\r\n"
              );


              String cmd =
                  line;


              line =
                  "";


              cmd.trim();

              cmd.toUpperCase();


              // ================================================
              // PHY
              // ================================================

              if (
                cmd == "PHY"
              ) {

                phy_start();

                continue;

              }


              // ================================================
              // CH
              // ================================================

              if (
                cmd.startsWith(
                  "CH "
                )
              ) {


                if (tx_active) {

                  send(
                    "ERR: OFF FIRST BEFORE CH"
                  );

                  continue;

                }


                if (!phy_ready) {

                  phy_start();

                }


                String a =
                    cmd.substring(
                      3
                    );


                a.trim();


                long ch =
                    a.toInt();


                if (
                  ch < 1
                  ||
                  ch > 13
                ) {

                  send(
                    "ERR CH 1..13"
                  );

                  continue;

                }


                set_channel(
                  (uint8_t)ch
                );


                continue;

              }


              // ================================================
              // FREQ
              // ================================================

              if (
                cmd.startsWith(
                  "FREQ "
                )
              ) {


                if (tx_active) {

                  send(
                    "ERR: OFF FIRST BEFORE FREQ"
                  );

                  continue;

                }


                if (!phy_ready) {

                  phy_start();

                }


                String a =
                    cmd.substring(
                      5
                    );


                a.trim();


                int mhz =
                    a.toInt();


                int ch =
                    mhz_to_channel(
                      mhz
                    );


                if (
                  ch < 1
                ) {

                  send(
                    "ERR FREQ: 2412..2472 MHz IN 5MHz STEPS"
                  );

                  continue;

                }


                set_channel(
                  (uint8_t)ch
                );


                continue;

              }


              // ================================================
              // ON
              // ================================================

              if (
                cmd == "ON"
              ) {


                if (!phy_ready) {

                  phy_start();

                }


                if (tx_active) {

                  send(
                    "TX ALREADY ON"
                  );

                  continue;

                }


                enter_manual();


                if (
                  !tx_path_on()
                ) {

                  send(
                    "ERR TX PATH"
                  );


                  leave_manual();

                  continue;

                }


                // Reapplique APWR si l'utilisateur
                // a deja configure le chemin analogique.
                if (
                  apwr_configured
                ) {

                  uint8_t ret =
                      apply_apwr(
                        current_apwr
                      );


                  char p[100];


                  snprintf(
                    p,
                    sizeof(p),

                    "APWR REAPPLY x=%u ROM_DIGITAL=%u",

                    current_apwr,

                    ret
                  );


                  send(p);

                }


                set_txclk(
                  1
                );


                tone_program(
                  current_k,
                  current_ask
                );


                tx_active =
                    true;


                uint32_t slot =
                    rd32(
                      TONE1
                    );


                char b[220];


                snprintf(
                  b,
                  sizeof(b),

                  "RF ON CH=%u CENTER=%dMHz K=%u ASK=%u APWR=%u SLOT=%08X GATE=%u",

                  current_channel,

                  channel_to_mhz(
                    current_channel
                  ),

                  current_k,

                  current_ask,

                  current_apwr,

                  (unsigned int)slot,

                  (slot & GATE_MASK)
                    ? 1
                    : 0
                );


                send(b);


                continue;

              }


              // ================================================
              // OFF
              // ================================================

              if (
                cmd == "OFF"
              ) {


                gate_off();


                set_txclk(
                  0
                );


                tx_path_off();


                leave_manual();


                tx_active =
                    false;


                send(
                  "OK RF OFF"
                );


                continue;

              }


              // ================================================
              // K n
              // ================================================

              if (
                cmd.startsWith(
                  "K "
                )
              ) {


                String a =
                    cmd.substring(
                      2
                    );


                a.trim();


                long value =
                    a.toInt();


                if (
                  value < 0
                  ||
                  value > 1023
                ) {

                  send(
                    "ERR K 0..1023"
                  );

                  continue;

                }


                current_k =
                    (uint16_t)value;


                if (tx_active) {

                  tone_set_k(
                    current_k
                  );

                }


                char b[60];


                snprintf(
                  b,
                  sizeof(b),

                  "OK K=%u",

                  current_k
                );


                send(b);


                continue;

              }


              // ================================================
              // ASK n
              //
              // DIGITAL ONLY
              // 0..63
              // ================================================

              if (
                cmd.startsWith(
                  "ASK "
                )
              ) {


                String a =
                    cmd.substring(
                      4
                    );


                a.trim();


                long value =
                    a.toInt();


                if (
                  value < 0
                  ||
                  value > 63
                ) {

                  send(
                    "ERR ASK 0..63"
                  );

                  continue;

                }


                current_ask =
                    (uint8_t)value;


                if (tx_active) {

                  ask_set_scale(
                    current_ask
                  );

                }


                uint8_t code =
                    ask_code(
                      current_ask
                    );


                char b[100];


                snprintf(
                  b,
                  sizeof(b),

                  "OK ASK=%u SCALE_CODE=0x%02X",

                  current_ask,

                  code
                );


                send(b);


                continue;

              }


              // ================================================
              // APWR n
              //
              // VRAI CHEMIN ANALOGIQUE
              //
              // Parametre brut ROM: 0..255.
              //
              // APWR NE TOUCHE PAS au champ ASK.
              // ================================================

              if (
                cmd.startsWith(
                  "APWR "
                )
              ) {


                String a =
                    cmd.substring(
                      5
                    );


                a.trim();


                long value =
                    a.toInt();


                if (
                  value < 0
                  ||
                  value > 255
                ) {

                  send(
                    "ERR APWR 0..255"
                  );

                  continue;

                }


                if (!phy_ready) {

                  phy_start();

                }


                current_apwr =
                    (uint8_t)value;


                uint8_t digital_return =
                    apply_apwr(
                      current_apwr
                    );


                apwr_configured =
                    true;


                uint8_t analog_code;


                if (
                  current_apwr < 64
                ) {

                  analog_code =
                      0;

                }

                else {

                  analog_code =
                      (uint8_t)(
                        63u
                        -
                        current_apwr
                      );

                }


                char b[180];


                snprintf(
                  b,
                  sizeof(b),

                  "OK APWR=%u ANALOG_CODE=0x%02X ROM_DIGITAL=%u ASK_UNCHANGED=%u",

                  current_apwr,

                  analog_code,

                  digital_return,

                  current_ask
                );


                send(b);


                continue;

              }


              // ================================================
              // STATUS
              // ================================================

              if (
                cmd == "STATUS"
              ) {


                uint32_t slot =
                    rd32(
                      TONE1
                    );


                uint8_t hw_ch =
                    wifi_get_channel();


                int mhz =
                    channel_to_mhz(
                      hw_ch
                    );


                uint16_t hw_k =
                    (uint16_t)(
                      slot
                      &
                      K_MASK
                    );


                uint8_t scale_code =
                    (uint8_t)(
                      (slot >> SCALE_SHIFT)
                      &
                      0xFFu
                    );


                uint8_t hw_ask =
                    get_hw_ask(
                      slot
                    );


                char b[260];


                snprintf(
                  b,
                  sizeof(b),

                  "PHY=%u TX=%u CH=%u CENTER=%dMHz K=%u HW_K=%u ASK=%u HW_ASK=%u SCALE_CODE=0x%02X APWR=%u APWR_SET=%u GATE=%u SLOT=%08X",

                  phy_ready
                    ? 1
                    : 0,

                  tx_active
                    ? 1
                    : 0,

                  hw_ch,

                  mhz,

                  current_k,

                  hw_k,

                  current_ask,

                  hw_ask,

                  scale_code,

                  current_apwr,

                  apwr_configured
                    ? 1
                    : 0,

                  (slot & GATE_MASK)
                    ? 1
                    : 0,

                  (unsigned int)slot
                );


                send(b);


                continue;

              }


              // ================================================
              // HELP
              // ================================================

              if (
                cmd == "HELP"
              ) {


                send("");

                send(
                  "ESP8266 RF CONSOLE"
                );

                send(
                  "------------------"
                );

                send(
                  "PHY         initialize PHY/RF"
                );

                send(
                  "CH n        channel 1..13"
                );

                send(
                  "FREQ MHz    2412..2472 step 5MHz"
                );

                send(
                  "K n         tone control 0..1023"
                );

                send(
                  "ASK n       DIGITAL scale 0..63"
                );

                send(
                  "APWR n      ANALOG scale ROM input 0..255"
                );

                send(
                  "ON          start RF tone"
                );

                send(
                  "OFF         stop RF tone"
                );

                send(
                  "STATUS"
                );

                send(
                  "HELP"
                );


                continue;

              }


              send(
                "ERR UNKNOWN"
              );

            }


            else if (
              c >= 32
              &&
              c <= 126
            ) {


              if (
                line.length()
                <
                63
              ) {

                line +=
                    (char)c;

              }

            }

          }